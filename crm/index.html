<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05161B">
<title>Vista CRM</title>
<link rel="icon" type="image/png" href="../img/logo-v.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:"Mefta";src:url("../mefta.otf") format("opentype");font-display:swap}
/* Mesma linguagem do site: noite de ilha de edição, luz menta/azul, pílulas de vidro */
:root{
  --ink:#05161B; --ink-2:#08262D; --ink-3:#0B2F37;
  --line:rgba(238,247,243,.12); --line-2:rgba(238,247,243,.2);
  --fg:#EEF7F3; --muted:#8FB3AA;
  --mint:#5CF2C0; --teal:#2BBFB0; --blue:#1A8FBF; --amber:#F2C46B; --late:#FF8A78;
  --grad:linear-gradient(120deg,#6FF5C8 0%,#2BBFB0 55%,#1A8FBF 100%);
  --display:"Mefta","Arial Narrow",Arial,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:clip;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:8px}

/* luz de fundo */
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(50% 40% at 85% -5%,rgba(26,143,191,.35),transparent 70%),
    radial-gradient(45% 35% at 10% 0%,rgba(92,242,192,.16),transparent 70%),
    radial-gradient(40% 40% at 50% 110%,rgba(43,191,176,.12),transparent 70%)}
.glow::after{content:"";position:absolute;left:-20%;right:-20%;top:0;height:420px;
  background-image:linear-gradient(rgba(92,242,192,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(92,242,192,.07) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent);mask-image:linear-gradient(to bottom,#000,transparent)}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,border-color .2s}
.btn-primary{background:var(--grad);color:var(--ink);box-shadow:0 0 0 1px rgba(111,245,200,.4),0 10px 30px -10px rgba(92,242,192,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(111,245,200,.6),0 14px 40px -8px rgba(92,242,192,.75)}
.btn-ghost{border:1px solid var(--line);background:rgba(238,247,243,.04)}
.btn-ghost:hover{background:rgba(238,247,243,.09);border-color:var(--line-2)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn:active{transform:scale(.97)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-top:14px}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;padding:0 9px 0 20px;border:1px solid var(--line);border-radius:999px;
  background:rgba(5,22,27,.62);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.nav-l{display:flex;align-items:center;gap:14px;min-width:0}
.nav-l img{height:20px;width:auto}
.nav-l .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink);background:var(--mint);padding:3px 8px;border-radius:999px}
.nav-r{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.sync.off i{background:var(--amber);box-shadow:0 0 10px rgba(242,196,107,.6)}

/* cabeçalho da página */
.top{padding-block:44px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.top h1{font-size:clamp(40px,6vw,68px);line-height:1}
.top h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--muted);margin-top:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{min-width:104px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(238,247,243,.03)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat.hot b{color:var(--mint)}

/* cartões */
.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(8,38,45,.85),rgba(5,22,27,.85));box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
main{display:grid;gap:20px;padding-bottom:60px}

/* hoje */
.today{padding:20px}
.today-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.today-head h2{font-size:26px}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:112px 1fr auto;gap:14px;align-items:center;padding:12px 12px 12px 14px;border-radius:14px;border:1px solid rgba(92,242,192,.16);background:rgba(92,242,192,.05);transition:transform .2s var(--ease),border-color .2s}
.task:hover{border-color:rgba(92,242,192,.35)}
.task.late{border-color:rgba(255,138,120,.22);background:rgba(255,138,120,.06)}
.when{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mint)}
.task.late .when{color:var(--late)}
.what{min-width:0}
.what b{display:block;font-weight:500}
.what small{color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px}
.done-box{grid-column:1/-1;display:grid;gap:10px;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.empty-today{color:var(--muted);padding:6px 2px}

/* lista */
.list-card{padding:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:rgba(238,247,243,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mint);background:rgba(92,242,192,.05)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select option{background:var(--ink-2)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
textarea{resize:vertical;min-height:80px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);transition:all .2s var(--ease)}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--ink);border-color:transparent;font-weight:500}
.chip b{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.7;margin-left:4px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1.7fr 1fr 1fr 90px;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);border-radius:0;transition:background .2s,transform .2s var(--ease)}
.row:not(.head):hover{background:rgba(238,247,243,.04);transform:translateX(3px)}
.row.head{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:10px;cursor:default}
.name{min-width:0}
.name b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{color:var(--muted);font-size:13px}
.type{font-size:13px;color:var(--muted)}
.stage{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.stage i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.stage[data-s="Prospectar"] i{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.stage[data-s="Em andamento"] i{background:var(--amber);box-shadow:0 0 8px rgba(242,196,107,.6)}
.stage[data-s="Fechado"] i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.stage[data-s="Perdido"] i{background:var(--late)}
.next{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.next.late{color:var(--late)}.next.now{color:var(--mint)}.next.none{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}
.foot .tools{display:flex;gap:6px}

/* painel */
.scrim{position:fixed;inset:0;background:rgba(2,10,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:41;overflow-y:auto;display:grid;gap:14px;align-content:start;
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#0A2B33,#05161B);border-left:1px solid var(--line);box-shadow:-30px 0 60px -20px rgba(0,0,0,.6)}
.panel h3{font-size:30px;line-height:1.05}
.field{display:grid;gap:6px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:8px}
.confirm{color:var(--late);font-size:13px}
.note{font-size:13px;color:var(--muted)}

/* login */
.login{min-height:calc(100vh - 100px);display:grid;place-items:center;padding-block:40px}
.login .card{width:min(400px,100%);padding:30px 26px;display:grid;gap:14px}
.login img{height:24px;width:auto;margin-bottom:6px}
.login h1{font-size:40px;line-height:1}
.err{color:var(--late);font-size:13px;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:999px;background:var(--grad);color:var(--ink);font-weight:500;font-size:14px;box-shadow:0 10px 30px -8px rgba(92,242,192,.6)}

@media (max-width:680px){
  .nav-in{padding-left:16px}
  .sync span,.hide-sm{display:none}
  .row{grid-template-columns:1fr auto}
  .row .c-type,.row .c-stage{display:none}
  .row.head{display:none}
  .task{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .top{padding-top:30px}
  .stat{min-width:0;flex:1;padding:12px}
  .stat span{letter-spacing:.04em;white-space:nowrap}
}

@media (prefers-reduced-motion:no-preference){
  .boot .top,.boot .today,.boot .list-card{animation:up .7s var(--ease) both}
  .boot .today{animation-delay:.08s}.boot .list-card{animation-delay:.16s}
  .boot .task,.boot .row{animation:up .5s var(--ease) both;animation-delay:calc(.25s + var(--i,0)*40ms)}
  @keyframes up{from{opacity:0;transform:translateY(14px)}}
  .row.fresh{animation:fresh 1.6s var(--ease)}
  @keyframes fresh{0%{background:rgba(92,242,192,.16)}100%{background:transparent}}
  .task.leaving{animation:leave .32s var(--ease) forwards}
  @keyframes leave{to{opacity:0;transform:translateX(30px)}}
  .done-box{animation:drop .25s var(--ease) both}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}}
  .scrim{animation:fade .25s ease-out}.panel{animation:slide .35s var(--ease)}
  .scrim.closing{animation:fade .2s ease-in reverse forwards}.panel.closing{animation:slide .22s ease-in reverse forwards}
  @keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(48px);opacity:0}}
  .toast{animation:toast .35s var(--ease)}
  @keyframes toast{from{opacity:0;transform:translate(-50%,12px)}}
  .sync.on i{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 18px var(--mint)}}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<div class="nav wrap">
  <div class="nav-in">
    <div class="nav-l"><a href="../" aria-label="Site da Vista Studios"><img src="../img/logo-vista.png" alt="Vista Studios"></a><span class="tag">CRM</span></div>
    <div class="nav-r">
      <span class="sync" id="sync" title=""><i></i><span id="sync-t">…</span></span>
      <button class="btn btn-ghost btn-sm hide-sm" id="btn-out" hidden>Sair</button>
      <button class="btn btn-primary" id="btn-new" hidden>+ Novo contato</button>
    </div>
  </div>
</div>

<section class="login wrap" id="login" hidden>
  <form class="card" id="login-form">
    <img src="../img/logo-vista.png" alt="Vista Studios">
    <h1>Entrar no CRM</h1>
    <p class="note">Use o e-mail e a senha cadastrados para a equipe.</p>
    <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Senha</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="l-err"></p>
    <button class="btn btn-primary" type="submit" id="l-btn">Entrar</button>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <div class="eyebrow" id="today-date"></div>
      <h1>Bom trabalho, <em>Vista.</em></h1>
      <p class="sub" id="sub">Seus follow-ups do dia estão logo abaixo.</p>
    </div>
    <div class="stats">
      <div class="stat hot"><b id="s-hoje">0</b><span>Para hoje</span></div>
      <div class="stat"><b id="s-ativos">0</b><span>Ativos</span></div>
      <div class="stat"><b id="s-fechados">0</b><span>Fechados</span></div>
    </div>
  </div>

  <main>
    <section class="card today" aria-labelledby="today-title">
      <div class="today-head"><h2 id="today-title">Para hoje</h2><span class="eyebrow" id="today-count"></span></div>
      <div class="tasks" id="tasks"><p class="empty-today">Carregando…</p></div>
    </section>

    <section class="card list-card" aria-label="Contatos">
      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Buscar por nome, telefone ou @">
        <select id="f-stage" style="width:auto" aria-label="Filtrar por etapa"><option value="">Todas as etapas</option></select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
      <div class="list" id="list"></div>
      <div class="foot">
        <span id="counts"></span>
        <div class="tools">
          <button class="btn btn-ghost btn-sm" id="btn-export">Exportar backup</button>
          <button class="btn btn-ghost btn-sm" id="btn-import">Importar</button>
          <input type="file" id="f-import" accept=".json,application/json" hidden>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-labelledby="p-title">
  <span class="eyebrow" id="p-eyebrow">Novo contato</span>
  <h3 id="p-title">Novo contato</h3>
  <div class="field"><label for="p-nome">Nome</label><input id="p-nome" placeholder="Ex.: Mariana Souza / Hotel Mar Azul"></div>
  <div class="two">
    <div class="field"><label for="p-tipo">Tipo</label><select id="p-tipo"></select></div>
    <div class="field"><label for="p-etapa">Etapa</label><select id="p-etapa"></select></div>
  </div>
  <div class="field"><label for="p-contato">Telefone / Instagram</label><input id="p-contato" placeholder="(71) 9 9999-9999 · @perfil"></div>
  <div class="two">
    <div class="field"><label for="p-prox">Próximo contato</label><input id="p-prox" type="date"></div>
    <div class="field"><label for="p-acao">O que fazer</label><input id="p-acao" placeholder="Ex.: Mandar portfólio"></div>
  </div>
  <div class="quick" id="p-quick"></div>
  <div class="field"><label for="p-nota">Observações</label><textarea id="p-nota" placeholder="Bairro, nº de imóveis, como chegou até você…"></textarea></div>
  <p class="note" id="p-ultimo"></p>
  <div class="panel-foot">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="p-del">Excluir</button>
      <span class="confirm" id="p-confirm" hidden>Toque de novo para excluir</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="p-cancel">Cancelar</button>
      <button class="btn btn-primary" id="p-save">Salvar</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* ====== CONFIGURAÇÃO DO FIREBASE ======
   Cole aqui o objeto firebaseConfig do seu projeto (Firebase → Configurações do projeto → Seus apps → Web).
   Enquanto estiver vazio, o CRM funciona em modo local (salva só neste navegador). */
const FIREBASE_CONFIG = null;
/* ====================================== */

const TIPOS=["Corretor","Adm. Airbnb","Proprietário","Hotel","Imobiliária"];
const ETAPAS=["Prospectar","Em andamento","Fechado","Perdido"];
const ANTIGAS={"Novo":"Prospectar","Em conversa":"Em andamento","Proposta":"Em andamento","Cliente":"Fechado"};
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let col=null, contatos=[], filtroTipo="", editId=null, openDone=null, fresh=new Set(), known=null, unsub=null;

const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hojeISO=()=>isoOf(new Date());
function addDias(iso,n){const [y,m,d]=iso.split("-").map(Number);return isoOf(new Date(y,m-1,d+n))}
function fmt(iso){if(!iso)return"";const [,m,d]=iso.split("-");return d+"/"+m}
function diasAte(iso){const [y,m,d]=iso.split("-").map(Number);const h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-h)/864e5)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=true;void el.offsetWidth;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2000)}
function setSync(state,text,title){const s=$("sync");s.className="sync "+state;$("sync-t").textContent=text;s.title=title||""}

$("today-date").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
$("p-tipo").innerHTML=TIPOS.map(t=>`<option>${t}</option>`).join("");
$("p-etapa").innerHTML=ETAPAS.map(t=>`<option>${t}</option>`).join("");
$("f-stage").innerHTML+=ETAPAS.map(t=>`<option>${t}</option>`).join("");
$("p-quick").innerHTML=[["Amanhã",1],["+3 dias",3],["+1 semana",7],["+2 semanas",14],["Sem data",0]].map(([l,n])=>`<button class="chip" type="button" data-n="${n}">${l}</button>`).join("");
$("p-quick").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;const n=+b.dataset.n;$("p-prox").value=n?addDias(hojeISO(),n):""};

/* ---------- render ---------- */
function renderChips(){
  const opts=[["","Todos"],...TIPOS.map(t=>[t,t])];
  $("chips").innerHTML=opts.map(([v,l])=>{const n=v?contatos.filter(c=>c.tipo===v).length:contatos.length;return `<button class="chip" aria-pressed="${filtroTipo===v}" data-v="${esc(v)}">${l}<b>${n}</b></button>`}).join("");
}
$("chips").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;filtroTipo=b.dataset.v;render()};
$("q").oninput=()=>renderList();
$("f-stage").onchange=()=>renderList();

function dueList(){const h=hojeISO();return contatos.filter(c=>c.proximo&&c.proximo<=h&&c.etapa!=="Perdido"&&c.etapa!=="Fechado").sort((a,b)=>a.proximo.localeCompare(b.proximo))}
function renderTasks(){
  const due=dueList();
  $("today-count").textContent=due.length?`${due.length} follow-up${due.length>1?"s":""}`:"";
  $("sub").textContent=due.length?`Você tem ${due.length} contato${due.length>1?"s":""} para retomar hoje.`:"Nenhum follow-up pendente. Hora de prospectar.";
  if(!due.length){$("tasks").innerHTML=`<p class="empty-today">${contatos.length?"Nada agendado para hoje. Defina o próximo contato nas fichas para ele aparecer aqui.":"Seus follow-ups do dia aparecem aqui. Adicione um contato e defina a data do próximo contato."}</p>`;return}
  $("tasks").innerHTML=due.map((c,i)=>{
    const d=diasAte(c.proximo),late=d<0,when=late?(d===-1?"ontem":`${-d} dias atrás`):"hoje";
    return `<div class="task${late?" late":""}" data-id="${c.id}" style="--i:${i}">
      <span class="when">${when}</span>
      <div class="what"><b>${esc(c.acao||"Entrar em contato")}</b><small>${esc(c.nome)} · ${esc(c.tipo)}${c.contato?" · "+esc(c.contato):""}</small></div>
      <div class="acts"><button class="btn btn-primary btn-sm" data-act="done">Feito</button><button class="btn btn-ghost btn-sm" data-act="snooze">Amanhã</button><button class="btn btn-ghost btn-sm" data-act="open">Ficha</button></div>
      ${openDone===c.id?`<div class="done-box"><span class="note">Quando é o próximo contato?</span>
        <div class="quick">${[["+2 dias",2],["+1 semana",7],["+2 semanas",14],["+1 mês",30]].map(([l,n])=>`<button class="chip" data-act="next" data-n="${n}">${l}</button>`).join("")}<button class="chip" data-act="next" data-n="0">Sem próximo</button></div>
        <input id="done-acao" placeholder="Próxima ação (opcional)"></div>`:""}
    </div>`}).join("");
}
$("tasks").onclick=async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.closest(".task").dataset.id,c=contatos.find(x=>x.id===id);if(!c)return;
  const act=b.dataset.act;
  if(act==="open")return openPanel(c);
  if(act==="done"){openDone=openDone===id?null:id;renderTasks();setTimeout(()=>$("done-acao")?.focus(),0);return}
  if(act==="snooze"){await leave(b);await save(id,{proximo:addDias(hojeISO(),1)});toast("Adiado para amanhã");return}
  if(act==="next"){const n=+b.dataset.n,acao=$("done-acao")?.value.trim();
    const patch={ultimo:hojeISO(),proximo:n?addDias(hojeISO(),n):"",acao:n?(acao||c.acao||""):""};
    if(c.etapa==="Prospectar")patch.etapa="Em andamento";
    openDone=null;await leave(b);await save(id,patch);toast(n?`Próximo contato em ${fmt(patch.proximo)}`:"Concluído");}
};

function renderList(){
  const q=$("q").value.trim().toLowerCase(),st=$("f-stage").value,h=hojeISO();
  const rows=contatos.filter(c=>(!filtroTipo||c.tipo===filtroTipo)&&(!st||c.etapa===st)&&(!q||(c.nome+" "+(c.contato||"")).toLowerCase().includes(q)))
    .sort((a,b)=>(a.proximo||"9999").localeCompare(b.proximo||"9999")||a.nome.localeCompare(b.nome));
  const head=`<div class="row head"><span>Contato</span><span class="c-type">Tipo</span><span class="c-stage">Etapa</span><span style="text-align:right">Próximo</span></div>`;
  if(!contatos.length)$("list").innerHTML=`<div class="empty">Nenhum contato ainda.<br>Toque em <b>+ Novo contato</b> para começar.</div>`;
  else if(!rows.length)$("list").innerHTML=head+`<div class="empty">Nenhum contato com esses filtros.</div>`;
  else $("list").innerHTML=head+rows.map((c,i)=>{
    let nx=`<span class="next none">—</span>`;
    if(c.proximo){const cls=c.proximo<h?"late":c.proximo===h?"now":"";nx=`<span class="next ${cls}">${c.proximo===h?"hoje":fmt(c.proximo)}</span>`}
    return `<button class="row${fresh.has(c.id)?" fresh":""}" data-id="${c.id}" style="--i:${Math.min(i,12)}"><span class="name"><b>${esc(c.nome)}</b><small>${esc(c.contato||c.tipo)}</small></span><span class="c-type type">${esc(c.tipo)}</span><span class="c-stage stage" data-s="${esc(c.etapa)}"><i></i>${esc(c.etapa)}</span>${nx}</button>`}).join("");
  const ativos=contatos.filter(c=>c.etapa==="Prospectar"||c.etapa==="Em andamento").length,fech=contatos.filter(c=>c.etapa==="Fechado").length;
  $("counts").textContent=contatos.length?`${contatos.length} contato${contatos.length>1?"s":""}`:"";
  $("s-hoje").textContent=dueList().length;$("s-ativos").textContent=ativos;$("s-fechados").textContent=fech;
}
$("list").onclick=e=>{const r=e.target.closest(".row[data-id]");if(r)openPanel(contatos.find(c=>c.id===r.dataset.id))};
function render(){renderChips();renderTasks();renderList()}

/* ---------- painel ---------- */
function openPanel(c){
  editId=c?c.id:null;
  $("p-eyebrow").textContent=c?"Ficha do contato":"Novo contato";
  $("p-title").textContent=c?c.nome:"Novo contato";
  $("p-nome").value=c?.nome||"";$("p-tipo").value=c?.tipo||filtroTipo||TIPOS[0];$("p-etapa").value=c?.etapa||"Prospectar";
  $("p-contato").value=c?.contato||"";$("p-prox").value=c?.proximo||"";$("p-acao").value=c?.acao||"";$("p-nota").value=c?.nota||"";
  $("p-ultimo").textContent=c?.ultimo?`Último contato: ${fmt(c.ultimo)}`:"";
  $("p-del").hidden=!c;$("p-confirm").hidden=true;$("p-del").dataset.armed="";
  $("panel").hidden=false;$("scrim").hidden=false;
  if(matchMedia("(min-width:681px)").matches)setTimeout(()=>$("p-nome").focus(),0);
}
function closePanel(){editId=null;const p=$("panel"),sc=$("scrim");if(p.hidden)return;
  if(reduce){p.hidden=sc.hidden=true;return}
  p.classList.add("closing");sc.classList.add("closing");
  setTimeout(()=>{p.hidden=sc.hidden=true;p.classList.remove("closing");sc.classList.remove("closing")},210)}
function leave(b){const t=b.closest(".task");if(!t||reduce)return Promise.resolve();t.classList.add("leaving");return new Promise(r=>setTimeout(r,300))}
$("btn-new").onclick=()=>openPanel(null);
$("p-cancel").onclick=closePanel;$("scrim").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("panel").hidden)closePanel()});

$("p-save").onclick=async()=>{
  const nome=$("p-nome").value.trim();if(!nome){$("p-nome").focus();toast("Preencha o nome");return}
  const data={nome,tipo:$("p-tipo").value,etapa:$("p-etapa").value,contato:$("p-contato").value.trim(),proximo:$("p-prox").value,acao:$("p-acao").value.trim(),nota:$("p-nota").value.trim()};
  if(!col){toast("Aguarde, conectando…");return}
  try{if(editId)await col.update(editId,data);else{data.criado=hojeISO();await col.add(data)}closePanel();toast("Salvo")}
  catch(err){console.error(err);toast("Não foi possível salvar. Tente de novo.")}
};
$("p-del").onclick=async()=>{
  if(!editId)return;
  if(!$("p-del").dataset.armed){$("p-del").dataset.armed="1";$("p-confirm").hidden=false;return}
  try{await col.remove(editId);closePanel();toast("Contato excluído")}catch(err){console.error(err);toast("Não foi possível excluir.")}
};
async function save(id,patch){try{await col.update(id,patch)}catch(err){console.error(err);toast("Não foi possível salvar.")}}

/* ---------- backup ---------- */
$("btn-export").onclick=()=>{
  const data=JSON.stringify(contatos.map(({id,...r})=>r),null,2);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download=`vista-crm-backup-${hojeISO()}.json`;document.body.append(a);a.click();a.remove();
  toast(`${contatos.length} contatos exportados`);
};
$("btn-import").onclick=()=>$("f-import").click();
$("f-import").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
    const chave=c=>(c.nome||"").trim().toLowerCase()+"|"+(c.contato||"").trim().toLowerCase();
    const existentes=new Set(contatos.map(chave));let n=0;
    for(const c of arr){if(!c||!c.nome||existentes.has(chave(c)))continue;
      const {id,...r}=c;r.etapa=ANTIGAS[r.etapa]||r.etapa||"Prospectar";await col.add(r);existentes.add(chave(c));n++}
    toast(n?`${n} contatos importados`:"Nenhum contato novo no arquivo");
  }catch(err){toast("Arquivo inválido. Use um backup exportado pelo CRM.")}
};

/* ---------- dados ---------- */
function startData(c){
  col=c;$("app").hidden=false;$("btn-new").hidden=false;
  document.body.classList.add("boot");setTimeout(()=>document.body.classList.remove("boot"),1800);
  unsub=col.listen(list=>{
    contatos=list.map(c=>({...c,etapa:ANTIGAS[c.etapa]||c.etapa||"Prospectar"}));
    if(known)fresh=new Set(contatos.map(c=>c.id).filter(id=>!known.has(id)));
    known=new Set(contatos.map(c=>c.id));render();
  });
}

function localCol(){
  const KEY="vista-crm-contatos";let arr=[],subs=[];
  try{arr=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){arr=[]}
  const emit=()=>{try{localStorage.setItem(KEY,JSON.stringify(arr))}catch(e){toast("Não foi possível salvar neste navegador")}subs.forEach(f=>f(arr.map(o=>({...o}))))};
  return{
    add:async d=>{arr.push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});emit()},
    update:async(id,p)=>{const o=arr.find(x=>x.id===id);if(o)Object.assign(o,p);emit()},
    remove:async id=>{arr=arr.filter(x=>x.id!==id);emit()},
    listen:f=>{subs.push(f);f(arr.map(o=>({...o})));return()=>{subs=subs.filter(x=>x!==f)}}
  };
}

async function startFirebase(){
  setSync("","Conectando");
  const V="10.12.2",B=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp},fs,au]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js"),import(B+"firebase-auth.js")]);
  const app=initializeApp(FIREBASE_CONFIG);
  let db;try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
  const auth=au.getAuth(app);
  const ref=fs.collection(db,"contatos");
  const fcol={
    add:d=>fs.addDoc(ref,{...d,atualizado:fs.serverTimestamp()}),
    update:(id,p)=>fs.updateDoc(fs.doc(db,"contatos",id),{...p,atualizado:fs.serverTimestamp()}),
    remove:id=>fs.deleteDoc(fs.doc(db,"contatos",id)),
    listen:f=>fs.onSnapshot(ref,{includeMetadataChanges:true},s=>{
      const pend=s.metadata.hasPendingWrites,off=s.metadata.fromCache;
      setSync(off||pend?"off":"on",off?"Offline":pend?"Salvando":"Sincronizado",off?"Sem internet: as mudanças sobem quando a conexão voltar.":"Mesmos contatos em todos os aparelhos.");
      f(s.docs.map(d=>({id:d.id,...d.data()})));
    },err=>{console.error(err);setSync("off","Sem acesso","Sua conta não tem permissão para ver os contatos.");toast("Sua conta não tem acesso aos contatos.")})
  };
  $("login-form").onsubmit=async e=>{
    e.preventDefault();$("l-err").textContent="";$("l-btn").disabled=true;
    try{await au.signInWithEmailAndPassword(auth,$("l-email").value.trim(),$("l-pass").value)}
    catch(err){$("l-err").textContent=/invalid|wrong|not-found|credential/.test(err.code||"")?"E-mail ou senha incorretos.":"Não foi possível entrar. Verifique a internet."}
    finally{$("l-btn").disabled=false}
  };
  $("btn-out").onclick=()=>au.signOut(auth);
  au.onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}
    if(u){$("login").hidden=true;$("btn-out").hidden=false;startData(fcol)}
    else{$("app").hidden=true;$("btn-new").hidden=true;$("btn-out").hidden=true;$("login").hidden=false;setSync("","Desconectado");contatos=[];known=null}
  });
}

if(FIREBASE_CONFIG){startFirebase().catch(err=>{console.error(err);setSync("off","Erro");toast("Não foi possível conectar ao banco de dados.")})}
else{setSync("off","Só neste aparelho","Os contatos ficam salvos apenas neste navegador.");startData(localCol())}
</script>
