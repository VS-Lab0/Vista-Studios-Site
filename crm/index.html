<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Vista CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: faixa com o gradiente da marca, agenda do dia sobreposta a ela, lista de contatos abaixo, ficha em painel lateral */
:root{
  --bg:#eef6f4; --surface:#ffffff; --line:#d4e7e2; --fg:#0b2c2a; --muted:#5a7672;
  --accent:#07a585; --accent-strong:#06705f; --accent-ink:#ffffff; --teal:#1386b0; --late:#cc4434; --late-bg:#fdecea; --today-bg:#e4f8f1;
  --g1:#0a5c58; --g2:#08a487; --g3:#6fe6c8; --g4:#1388b4;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"DM Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05201e; --surface:#0b2c2a; --line:#174441; --fg:#e4faf5; --muted:#86aba5;
  --accent:#0bd8a6; --accent-strong:#5ff0c9; --accent-ink:#03231d; --teal:#46b8df; --late:#f08070; --late-bg:#3a1f1c; --today-bg:#0e3c36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05201e; --surface:#0b2c2a; --line:#174441; --fg:#e4faf5; --muted:#86aba5;
  --accent:#0bd8a6; --accent-strong:#5ff0c9; --accent-ink:#03231d; --teal:#46b8df; --late:#f08070; --late-bg:#3a1f1c; --today-bg:#0e3c36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.band{background:
  radial-gradient(120% 140% at 0% 100%, var(--g3) 0%, transparent 55%),
  radial-gradient(90% 120% at 100% 100%, var(--g4) 0%, transparent 60%),
  linear-gradient(120deg, var(--g1) 0%, var(--g2) 55%, #0ad6a4 100%);
  padding:28px 16px 84px}
.band-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wrap{max-width:980px;margin:-60px auto 0;padding:0 16px 64px;display:grid;gap:22px;position:relative}
.brand{display:flex;align-items:center;gap:6px;color:#fff}
.logo{display:block;height:34px;width:auto;max-width:62vw}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:30px;margin:0;letter-spacing:.01em;line-height:1}
.brand .dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:#fff;margin-left:.08em}
.brand span{font-family:var(--f-display);font-weight:500;font-size:17px}
.brand em{font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-left:12px;font-weight:600}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.onband{background:#fff;border-color:#fff;color:#0a5c58;padding:10px 16px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Hoje */
.today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 12px 32px -18px rgba(6,60,55,.45)}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.today-head h2{margin:0;font-size:18px;font-family:var(--f-display);font-weight:600}
.today-head .date{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--today-bg)}
.task.late{background:var(--late-bg)}
.task .when{font-family:var(--f-mono);font-size:12px;color:var(--accent-strong);white-space:nowrap;min-width:64px}
.task.late .when{color:var(--late)}
.task .what{min-width:0}
.task .what b{display:block}
.task .what small{color:var(--muted)}
.task .acts{display:flex;gap:6px}
.task .acts .btn{padding:6px 10px;font-size:13px}
.done-box{grid-column:1/-1;display:grid;gap:8px;padding-top:6px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.empty-today{color:var(--muted);margin:0}

/* Lista */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row.head{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-block:9px}
.row.head:hover{background:transparent}
.name{min-width:0}
.name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;color:var(--teal)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.stage[data-s="Em andamento"] i{background:var(--teal)}
.stage[data-s="Fechado"] i{background:var(--accent)}
.stage[data-s="Perdido"] i{background:var(--late)}
.next{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.next.late{color:var(--late)} .next.now{color:var(--accent-strong);font-weight:600}
.next.none{color:var(--muted);font-family:var(--f-body)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.counts{color:var(--muted);font-size:13px}

/* Painel */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:10}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:11;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.panel h3{margin:0;font-size:18px;font-family:var(--f-display);font-weight:600}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:6px}
.confirm{color:var(--late);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
@media (max-width:640px){
  .row{grid-template-columns:1fr auto}
  .row .c-type,.row .c-stage{display:none}
  .row.head{display:none}
  .task{grid-template-columns:1fr}
  .task .acts{justify-content:flex-start}
  .two{grid-template-columns:1fr}
}
/* Movimento */
:root{--ease:cubic-bezier(.22,.8,.24,1)}
.btn,.chip,.row,.task,input,select,textarea{transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .18s var(--ease),box-shadow .2s var(--ease)}
@media (prefers-reduced-motion:no-preference){
  .band{background-size:140% 140%,140% 140%,200% 200%;animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{0%{background-position:0% 100%,100% 100%,0% 50%}100%{background-position:20% 80%,80% 100%,100% 50%}}
  .boot .band-in{animation:up .6s var(--ease) both}
  .boot .today{animation:up .6s .08s var(--ease) both}
  .boot .wrap>section:last-child{animation:up .6s .16s var(--ease) both}
  .boot .task,.boot .row{animation:up .45s var(--ease) both;animation-delay:calc(.22s + var(--i,0)*45ms)}
  @keyframes up{from{opacity:0;transform:translateY(12px)}}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(6,60,55,.6)}
  .btn:active,.chip:active{transform:scale(.96)}
  .chip:hover{border-color:var(--accent)}
  .row:not(.head):hover{transform:translateX(3px)}
  .task:hover{transform:translateY(-1px)}
  .row.fresh{animation:fresh 1.4s var(--ease)}
  @keyframes fresh{0%{background:var(--today-bg)}100%{background:transparent}}
  .task.leaving{animation:leave .32s var(--ease) forwards}
  @keyframes leave{to{opacity:0;transform:translateX(24px)}}
  .done-box{animation:drop .25s var(--ease) both}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}}
  .scrim{animation:fade .2s ease-out}
  .panel{animation:slide .28s var(--ease)}
  .scrim.closing{animation:fade .2s ease-in reverse forwards}
  .panel.closing{animation:slide .22s ease-in reverse forwards}
  @keyframes fade{from{opacity:0}}
  @keyframes slide{from{transform:translateX(40px);opacity:0}}
  .toast{animation:toast .3s var(--ease)}
  @keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
  .stage i{transition:background-color .3s}
}
</style>

let db=null, col=null, contatos=[], filtroTipo="", editId=null, openDone=null, readOnly=false;

function hojeISO(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDias(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function fmt(iso){if(!iso)return"";const [y,m,d]=iso.split("-");return d+"/"+m}
function diasAte(iso){const [y,m,d]=iso.split("-").map(Number);const a=new Date(y,m-1,d);const h=new Date();h.setHours(0,0,0,0);return Math.round((a-h)/864e5)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=true;void el.offsetWidth;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}

$("today-date").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
$("p-tipo").innerHTML=TIPOS.map(t=>`<option>${t}</option>`).join("");
$("p-etapa").innerHTML=ETAPAS.map(t=>`<option>${t}</option>`).join("");
$("f-stage").innerHTML+=ETAPAS.map(t=>`<option>${t}</option>`).join("");
$("p-quick").innerHTML=[["Amanhã",1],["+3 dias",3],["+1 semana",7],["+2 semanas",14],["Sem data",0]].map(([l,n])=>`<button class="chip" type="button" data-n="${n}">${l}</button>`).join("");
$("p-quick").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;const n=+b.dataset.n;$("p-prox").value=n?addDias(hojeISO(),n):""};

function renderChips(){
  const opts=[["","Todos"],...TIPOS.map(t=>[t,t])];
  $("chips").innerHTML=opts.map(([v,l])=>{const n=v?contatos.filter(c=>c.tipo===v).length:contatos.length;return `<button class="chip" aria-pressed="${filtroTipo===v}" data-v="${esc(v)}">${l} · ${n}</button>`}).join("");
}
$("chips").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;filtroTipo=b.dataset.v;render()};
$("q").oninput=()=>renderList();
$("f-stage").onchange=()=>renderList();

function renderTasks(){
  const h=hojeISO();
  const due=contatos.filter(c=>c.proximo&&c.proximo<=h&&c.etapa!=="Perdido").sort((a,b)=>a.proximo.localeCompare(b.proximo));
  if(!due.length){$("tasks").innerHTML=`<p class="empty-today">${contatos.length?"Nada agendado para hoje. Defina o próximo contato nas fichas para ele aparecer aqui.":"Seus follow-ups do dia aparecem aqui. Adicione um contato e defina a data do próximo contato."}</p>`;return}
  $("tasks").innerHTML=due.map((c,i)=>{
    const d=diasAte(c.proximo), late=d<0;
    const when=late?(d===-1?"ontem":`${-d} dias atrás`):"hoje";
    return `<div class="task ${late?"late":""}" data-id="${c.id}" style="--i:${i}">
      <span class="when">${when}</span>
      <div class="what"><b>${esc(c.acao||"Entrar em contato")}</b><small>${esc(c.nome)} · ${esc(c.tipo)}${c.contato?" · "+esc(c.contato):""}</small></div>
      <div class="acts">${readOnly?"":`<button class="btn primary" data-act="done">Feito</button><button class="btn" data-act="snooze">Amanhã</button>`}<button class="btn ghost" data-act="open">Ficha</button></div>
      ${openDone===c.id?`<div class="done-box">
        <span class="note">Quando é o próximo contato?</span>
        <div class="quick">${[["+2 dias",2],["+1 semana",7],["+2 semanas",14],["+1 mês",30]].map(([l,n])=>`<button class="chip" data-act="next" data-n="${n}">${l}</button>`).join("")}<button class="chip" data-act="next" data-n="0">Sem próximo</button></div>
        <input id="done-acao" placeholder="Próxima ação (opcional)" value="">
      </div>`:""}
    </div>`}).join("");
}
$("tasks").onclick=async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.closest(".task").dataset.id, c=contatos.find(x=>x.id===id);if(!c)return;
  const act=b.dataset.act;
  if(act==="open")return openPanel(c);
  if(act==="done"){openDone=openDone===id?null:id;renderTasks();setTimeout(()=>$("done-acao")?.focus(),0);return}
  if(act==="snooze"){await leave(b);await save(id,{proximo:addDias(hojeISO(),1)});toast("Adiado para amanhã");return}
  if(act==="next"){const n=+b.dataset.n;const acao=$("done-acao")?.value.trim();
    const patch={ultimo:hojeISO(),proximo:n?addDias(hojeISO(),n):"",acao:n?(acao||c.acao||""):""};
    if(c.etapa==="Prospectar")patch.etapa="Em andamento";
    openDone=null;await leave(b);await save(id,patch);toast(n?`Próximo contato em ${fmt(patch.proximo)}`:"Concluído");}
};

function renderList(){
  const q=$("q").value.trim().toLowerCase(), st=$("f-stage").value, h=hojeISO();
  let rows=contatos.filter(c=>(!filtroTipo||c.tipo===filtroTipo)&&(!st||c.etapa===st)&&(!q||(c.nome+" "+(c.contato||"")).toLowerCase().includes(q)));
  rows.sort((a,b)=>(a.proximo||"9999").localeCompare(b.proximo||"9999")||a.nome.localeCompare(b.nome));
  const head=`<div class="row head"><span>Contato</span><span class="c-type">Tipo</span><span class="c-stage">Etapa</span><span>Próximo</span></div>`;
  if(!contatos.length){$("list").innerHTML=`<div class="empty">Nenhum contato ainda.<br>Clique em <b>+ Novo contato</b> para começar.</div>`;$("counts").textContent="";return}
  if(!rows.length){$("list").innerHTML=head+`<div class="empty">Nenhum contato com esses filtros.</div>`}
  else $("list").innerHTML=head+rows.map((c,i)=>{
    let nx=`<span class="next none">—</span>`;
    if(c.proximo){const cls=c.proximo<h?"late":c.proximo===h?"now":"";nx=`<span class="next ${cls}">${c.proximo===h?"hoje":fmt(c.proximo)}</span>`}
    return `<button class="row${fresh.has(c.id)?" fresh":""}" data-id="${c.id}" style="--i:${Math.min(i,12)}"><span class="name"><b>${esc(c.nome)}</b><small>${esc(c.contato||c.tipo)}</small></span><span class="c-type tag">${esc(c.tipo)}</span><span class="c-stage stage" data-s="${esc(c.etapa)}"><i></i>${esc(c.etapa)}</span>${nx}</button>`}).join("");
  const ativos=contatos.filter(c=>c.etapa==="Prospectar"||c.etapa==="Em andamento").length, cli=contatos.filter(c=>c.etapa==="Fechado").length;
  $("counts").textContent=`${contatos.length} contatos · ${ativos} ativos · ${cli} fechados`;
}
$("list").onclick=e=>{const r=e.target.closest(".row[data-id]");if(r)openPanel(contatos.find(c=>c.id===r.dataset.id))};

function render(){renderChips();renderTasks();renderList()}

function openPanel(c){
  editId=c?c.id:null;
  $("p-title").textContent=c?c.nome:"Novo contato";
  $("p-nome").value=c?.nome||"";$("p-tipo").value=c?.tipo||filtroTipo||TIPOS[0];$("p-etapa").value=c?.etapa||"Prospectar";
  $("p-contato").value=c?.contato||"";$("p-prox").value=c?.proximo||"";$("p-acao").value=c?.acao||"";$("p-nota").value=c?.nota||"";
  $("p-ultimo").textContent=c?.ultimo?`Último contato: ${fmt(c.ultimo)}`:"";
  $("p-del").hidden=!c||readOnly;$("p-confirm").hidden=true;$("p-del").dataset.armed="";
  $("p-save").hidden=readOnly;
  $("panel").hidden=false;$("scrim").hidden=false;setTimeout(()=>$("p-nome").focus(),0);
}
function closePanel(){editId=null;const p=$("panel"),sc=$("scrim");if(p.hidden)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){p.hidden=sc.hidden=true;return}
  p.classList.add("closing");sc.classList.add("closing");
  setTimeout(()=>{p.hidden=sc.hidden=true;p.classList.remove("closing");sc.classList.remove("closing")},210)}
function leave(b){const t=b.closest(".task");if(!t||matchMedia("(prefers-reduced-motion: reduce)").matches)return Promise.resolve();t.classList.add("leaving");return new Promise(r=>setTimeout(r,300))}
$("btn-new").onclick=()=>openPanel(null);
$("p-cancel").onclick=closePanel;$("scrim").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("panel").hidden)closePanel()});

$("p-save").onclick=async()=>{
  const nome=$("p-nome").value.trim();if(!nome){$("p-nome").focus();toast("Preencha o nome");return}
  const data={nome,tipo:$("p-tipo").value,etapa:$("p-etapa").value,contato:$("p-contato").value.trim(),proximo:$("p-prox").value,acao:$("p-acao").value.trim(),nota:$("p-nota").value.trim()};
  if(!col){toast("Sem conexão com o banco de dados");return}
  try{
    if(editId){await save(editId,data)}
    else{data.criado=hojeISO();await col.add(data)}
    closePanel();toast("Salvo");
  }catch(err){toast(msg(err))}
};
$("p-del").onclick=async()=>{
  if(!editId)return;
  if(!$("p-del").dataset.armed){$("p-del").dataset.armed="1";$("p-confirm").hidden=false;return}
  try{await col.doc(editId).delete();closePanel();toast("Contato excluído")}catch(err){toast(msg(err))}
};
async function save(id,patch){try{await col.doc(id).update(patch)}catch(err){toast(msg(err))}}
function msg(err){return err?.code==="quota_exceeded"?"Limite de contatos atingido":err?.code==="invalid_argument"?"Você não tem permissão para editar":"Não foi possível salvar. Tente de novo."}

document.body.classList.add("boot");setTimeout(()=>document.body.classList.remove("boot"),1600);
/* Modo local: quando a página roda fora do claude.ai (arquivo baixado), salva neste navegador */
function localCol(){
  const KEY="vista-crm-contatos";let arr=[],subs=[];
  try{arr=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){arr=[]}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(arr))}catch(e){toast("Não foi possível salvar neste navegador")}};
  const snap=()=>({docs:arr.map(o=>({id:o.id,data:()=>{const {id,...r}=o;return r}}))});
  const emit=()=>{persist();const sn=snap();subs.forEach(f=>f(sn))};
  return{
    add:async d=>{arr.push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});emit()},
    doc:id=>({update:async p=>{const o=arr.find(x=>x.id===id);if(o)Object.assign(o,p);emit()},delete:async()=>{arr=arr.filter(x=>x.id!==id);emit()}}),
    onSnapshot:f=>{subs.push(f);f(snap());return()=>{subs=subs.filter(x=>x!==f)}}
  };
}
(async()=>{
  const online=typeof claude!=="undefined"&&claude&&typeof claude.use==="function";
  db=online?await claude.use("db"):null;
  if(!db){
    col=localCol();
    const n=document.createElement("p");n.className="note";n.style.margin="0";
    n.textContent="Modo offline: os contatos ficam salvos neste navegador, neste computador.";
    document.querySelector(".today").after(n);
  }else{
    const user=await claude.use("user");
    if(user){const w=await user.can("data.write");if(w===false){readOnly=true;$("btn-new").hidden=true}}
    col=db.collection("contatos");
  }
  col.onSnapshot(s=>{contatos=s.docs.map(d=>{const c={id:d.id,...d.data()};c.etapa=ANTIGAS[c.etapa]||c.etapa||"Prospectar";return c});
    if(known){fresh=new Set(contatos.map(c=>c.id).filter(id=>!known.has(id)))}known=new Set(contatos.map(c=>c.id));render()},
    ()=>{$("tasks").innerHTML=`<p class="empty-today">Conexão perdida. Recarregue a página.</p>`});
})();
</script>
</body></html>
